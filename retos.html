<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juguemos Dominó - Lección Interactiva</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .contenedor {
            max-width: 600px;
            width: 100%;
            background: #1e1e1e;
            border-radius: 12px;
            padding: 16px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.3rem;
            color: #ffb300;
            margin-top: 0;
            text-align: center;
        }
        .mesa {
            background-color: #1b5e20;
            border: 6px solid #0d3b12;
            border-radius: 16px;
            min-height: 200px;
            padding: 20px 10px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }
        .ficha {
            background-color: #fdfdfd;
            border-radius: 6px;
            display: flex;
            border: 1px solid #ccc;
        }
        .ficha.horizontal {
            width: 68px;
            height: 34px;
            flex-direction: row;
        }
        .ficha.doble {
            width: 34px;
            height: 68px;
            flex-direction: column;
        }
        .mitad {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 3px;
        }
        .ficha.horizontal .mitad:first-child {
            border-right: 1.5px solid #333;
        }
        .ficha.doble .mitad:first-child {
            border-bottom: 1.5px solid #333;
        }
        .punto {
            width: 6px;
            height: 6px;
            background-color: #1a1a1a;
            border-radius: 50%;
            align-self: center;
            justify-self: center;
        }
        .panel-info {
            background: #2a2a2a;
            border-left: 4px solid #ffb300;
            padding: 12px 15px;
            border-radius: 6px;
            min-height: 65px;
            margin-bottom: 15px;
        }
        .vuelta-tag {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #ffb300;
            font-weight: bold;
        }
        .texto-jugada {
            font-size: 1.05rem;
            margin: 5px 0 0 0;
            line-height: 1.4;
        }
        .controles {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #388e3c;
            color: white;
        }
        button:disabled {
            background: #444;
            color: #888;
        }
        .resumen-final {
            display: none;
            background: #1b3b1e;
            border: 1px solid #4caf50;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="contenedor">
    <h1>Dominada capturando 129 tantos</h1>
    
    <div class="mesa" id="mesa-juego"></div>

    <div class="panel-info">
        <div class="vuelta-tag" id="etiqueta-vuelta">Inicio</div>
        <p class="texto-jugada" id="descripcion-paso">Pulsa Siguiente para comenzar.</p>
    </div>

    <div class="controles">
        <button id="btn-anterior" onclick="cambiarPaso(-1)" disabled>⬅ Anterior</button>
        <button id="btn-siguiente" onclick="cambiarPaso(1)">Siguiente ➡</button>
    </div>

    <div class="resumen-final" id="caja-resumen">
        <strong>Resultado final:</strong> Se juegan 11 fichas. Han salido 39 tantos.<br>
        🏆 <strong>La pareja 1-3 captura 129 tantos.</strong>
    </div>
</div>

<script>
    var pasoActual = 0;

    var vueltas = new Array(
        "Inicio de la mano",
        "Vuelta 1",
        "Vuelta 2",
        "Vuelta 3",
        "Vuelta 4",
        "Vuelta 5",
        "Vuelta 6",
        "Vuelta 7 - ¡Dominada!"
    );

    var textos = new Array(
        "El Jugador 1 tiene todas las blancas (7 fichas) y lleva la salida.",
        "<strong>J1:</strong> Sale con 0:0.<br><strong>J2, J3 y J4:</strong> Pasan (ninguno tiene blancas).",
        "<strong>J1:</strong> Juega 0:3.<br><strong>J2:</strong> Juega 3:1 obligado.<br><strong>J3:</strong> Pasa.<br><strong>J4:</strong> Juega 1:5 obligado.",
        "<strong>J1:</strong> Golpea a blancas con 5:0.<br><strong>J2, J3 y J4:</strong> Pasan de nuevo.",
        "<strong>J1:</strong> Juega 0:2.<br><strong>J2:</strong> Juega obligado 2:1.<br><strong>J3 y J4:</strong> Pasan.",
        "<strong>J1:</strong> Vuelve a golpear a blancas con 1:0.<br><strong>J2, J3 y J4:</strong> Pasan.",
        "<strong>J1:</strong> Juega 0:4.<br><strong>J2:</strong> Juega obligado 4:1.<br><strong>J3 y J4:</strong> Pasan.",
        "<strong>J1:</strong> Juega 0:6 y domina la partida dejando a los rivales cargados."
    );

    var jugadasMesa = new Array(
        "",
        "0-0",
        "0-0,0-3,3-1,1-5",
        "0-0,0-3,3-1,1-5,5-0",
        "0-0,0-3,3-1,1-5,5-0,0-2,2-1",
        "0-0,0-3,3-1,1-5,5-0,0-2,2-1,1-0",
        "0-0,0-3,3-1,1-5,5-0,0-2,2-1,1-0,0-4,4-1",
        "0-0,0-3,3-1,1-5,5-0,0-2,2-1,1-0,0-4,4-1,0-6"
    );

    function obtenerPatron(num) {
        if (num === "1") return "000010000";
        if (num === "2") return "100000001";
        if (num === "3") return "100010001";
        if (num === "4") return "101000101";
        if (num === "5") return "101010101";
        if (num === "6") return "101101101";
        return "000000000";
    }

    function crearMitadHTML(num) {
        var html = '<div class="mitad">';
        var dibujo = obtenerPatron(num);
        for (var i = 0; i < 9; i++) {
            if (dibujo.charAt(i) === "1") {
                html += '<div class="punto"></div>';
            } else {
                html += '<div></div>';
            }
        }
        html += '</div>';
        return html;
    }

    function dibujarFicha(fichaStr) {
        var izq = fichaStr.charAt(0);
        var der = fichaStr.charAt(2);
        var claseTipo = (izq === der) ? 'ficha doble' : 'ficha horizontal';
        return '<div class="' + claseTipo + '">' + crearMitadHTML(izq) + crearMitadHTML(der) + '</div>';
    }

    function renderizar() {
        document.getElementById('etiqueta-vuelta').innerText = vueltas.at(pasoActual);
        document.getElementById('descripcion-paso').innerHTML = textos.at(pasoActual);
        
        var mesaDiv = document.getElementById('mesa-juego');
        var cadenaFichas = jugadasMesa.at(pasoActual);
        
        if (cadenaFichas === "") {
            mesaDiv.innerHTML = "";
        } else {
            var lista = cadenaFichas.split(',');
            var htmlTotal = "";
            for (var i = 0; i < lista.length; i++) {
                htmlTotal += dibujarFicha(lista.at(i));
            }
            mesaDiv.innerHTML = htmlTotal;
        }

        document.getElementById('btn-anterior').disabled = (pasoActual === 0);
        document.getElementById('btn-siguiente').disabled = (pasoActual === vueltas.length - 1);

        var resumenDiv = document.getElementById('caja-resumen');
        resumenDiv.style.display = (pasoActual === vueltas.length - 1) ? 'block' : 'none';
    }

    function cambiarPaso(direccion) {
        pasoActual += direccion;
        renderizar();
    }

    renderizar();
</script>

</body>
</html>
